<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>A4VFamily</title>
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Lịch chiếu Anime Vietsub bản quyền tại Việt Nam.">

  <script src="js/theme-init.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cal+Sans&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link visually-hidden-focusable" href="#main" data-skip-link>Đến nội dung chính</a>

  <header class="site-header">
    <div class="container site-header__bar">
      <a class="brand" href="#trang-chu" aria-label="A4VFamily, về trang lịch chiếu">A4VFamily<small>Lịch Chiếu Anime Bản Quyền</small></a>

      <nav class="primary-nav" aria-label="Điều hướng chính">
        <ul class="primary-nav__list">
          <li>
            <a class="primary-nav__link" href="#trang-chu" data-nav="trang-chu">
              <span class="material-symbols-rounded icon" aria-hidden="true">calendar_month</span>Lịch chiếu
            </a>
          </li>
          <li>
            <a class="primary-nav__link" href="#lich-chieu" data-nav="lich-chieu">
              <span class="material-symbols-rounded icon" aria-hidden="true">view_list</span>Theo mùa
            </a>
          </li>
          <li>
            <a class="primary-nav__link" href="#tim-anime" data-nav="tim-anime">
              <span class="material-symbols-rounded icon" aria-hidden="true">search</span>Tìm Anime
            </a>
          </li>
        </ul>
      </nav>

      <button class="btn btn-icon" type="button" id="theme-toggle" aria-label="Đổi nền sáng hoặc tối" data-bs-title="Đổi nền sáng/tối">
        <span class="material-symbols-rounded icon" aria-hidden="true">contrast</span>
      </button>
    </div>
  </header>

  <main class="container" id="main" tabindex="-1">
    <div class="empty-state">
      <div class="spinner-border" role="status"><span class="visually-hidden">Đang tải…</span></div>
    </div>
    <noscript><p class="text-center">Trang này cần JavaScript để hiển thị lịch chiếu.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <ul class="site-footer__list">
        <li><span class="material-symbols-rounded icon" aria-hidden="true">public</span><a href="https://www.facebook.com/a4vfamily" target="_blank" rel="noopener">Facebook</a></li>
        <li><span class="material-symbols-rounded icon" aria-hidden="true">mail</span><span class="user-select-all">a4vtranslation@gmail.com</span></li>
      </ul>
    </div>
  </footer>

  <div class="toast-container">
    <div class="toast" id="app-toast" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="3500">
      <div class="toast-body"></div>
    </div>
  </div>
</body>
</html>
