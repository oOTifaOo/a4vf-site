name: Cập nhật lịch chiếu
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["data/links.csv"]
permissions:
  contents: write
env:
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTKVrve7xXoM1txNQNzCd50WcMJX7O4D8PgOSJLqOhG9Dz5ZbctGEVQ7no_y4Pz0oZBVA_ERu4ZDvi_/pub?gid=76589246&single=true&output=csv"
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Xem máy chủ nhận được gì
        run: |
          echo "Độ dài URL: ${#SHEET_CSV_URL} ký tự"
          curl -sL "$SHEET_CSV_URL" | head -c 400
      - run: node scripts/update.mjs
      - name: Commit nếu dữ liệu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Cập nhật dữ liệu lịch chiếu" && git pull --rebase origin main && git push)
