name: Cập nhật lịch chiếu
on:
  schedule:
    - cron: "0 */6 * * *"   # mỗi 6 giờ (giờ UTC)
  workflow_dispatch:         # cho phép bấm chạy tay
  push:
    paths: ["data/links.csv"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      - name: Commit nếu dữ liệu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Cập nhật dữ liệu lịch chiếu" && git push)
