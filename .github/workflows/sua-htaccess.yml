# Dùng một lần: thêm quy tắc bộ nhớ đệm vào .htaccess trên host, có sao lưu và tự khôi phục nếu web lỗi.
name: Sửa bộ nhớ đệm trên host
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - name: Thêm quy tắc và kiểm tra
        run: |
          set -eu
          sudo apt-get install -y -qq lftp
          ftp() { lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" -e "set cmd:fail-exit true; set ssl:verify-certificate no; set net:max-retries 3; $1; bye"; }
          ftp "get public_html/.htaccess -o current.htaccess"
          grep -q "RewriteEngine" current.htaccess
          if grep -q "BEGIN A4VF Cache" current.htaccess; then echo "Quy tắc đã có sẵn"; exit 0; fi
          cat > rules.txt <<'RULES'
          # BEGIN A4VF Cache
          # Dữ liệu phim: trình duyệt hỏi lại server mỗi lần mở trang, file không đổi thì chỉ nhận 304.
          <FilesMatch "^(data\.js|kho\.json|mo-ta-.*\.json|mua-.*\.json)$">
          <IfModule mod_expires.c>
          ExpiresActive Off
          </IfModule>
          <IfModule mod_headers.c>
          Header unset Expires
          Header set Cache-Control "no-cache"
          </IfModule>
          </FilesMatch>
          # END A4VF Cache
          RULES
          sed -i 's/^ *//' rules.txt
          cat rules.txt current.htaccess > new.htaccess
          ftp "put current.htaccess -o public_html/.htaccess.sao-luu-2026-11-05"
          ftp "put new.htaccess -o public_html/.htaccess"
          sleep 8
          ok=1
          for path in / /data.js /theo-mua /phim/178868-hiep-si-phep-mau; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://a4vf.net$path" || true)"
            echo "$path $code"
            [ "$code" = "200" ] || ok=0
          done
          curl -sI https://a4vf.net/data.js | tr -d '\r' | grep -i '^cache-control\|^expires' || true
          curl -sI https://a4vf.net/data.js | tr -d '\r' | grep -qi '^cache-control: no-cache' || ok=0
          if [ "$ok" != "1" ]; then
            echo "Kiểm tra không đạt, khôi phục file cũ"
            ftp "put current.htaccess -o public_html/.htaccess"
            exit 1
          fi
          echo "Hoàn tất"
